<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">
<title>Birthday Written in the Moonlight</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Cinzel:wght@400;500;600&display=swap');

:root {
  --emerald:#087653;
  --silver:#d7ded9;
  --black:#030706;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--black);color:#f1f1ed;
  font-family:'Cormorant Garamond',serif;
  min-height:100vh;overflow-x:hidden;
}
#experience{
  min-height:100vh;position:relative;display:flex;
  align-items:center;justify-content:center;text-align:center;
  padding:35px 22px;isolation:isolate;overflow:hidden;
}
#experience::before{
  content:"";position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(8,118,83,.30),transparent 48%),
    linear-gradient(160deg,#07120e,#020403 75%);
  transition:background 1s ease;
}
#experience::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.12) 60%,rgba(0,0,0,.35));
}
.scene-image{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:-2;opacity:.58;
  display:none;
}
.content{width:min(720px,100%);margin:auto;position:relative;padding:35px 0}
.eyebrow{
  font-family:'Cinzel',serif;letter-spacing:5px;font-size:10px;
  color:#a8c9b9;text-transform:uppercase;margin-bottom:28px;
}
h1,h2{
  font-family:'Cinzel',serif;font-weight:400;line-height:1.35;
  text-shadow:0 2px 25px #000;
}
h1{font-size:clamp(30px,7vw,58px);letter-spacing:3px}
h2{font-size:clamp(25px,6vw,42px);letter-spacing:2px}
p{
  font-size:clamp(19px,4vw,25px);line-height:1.55;
  color:#e0e5e1;max-width:570px;margin:22px auto;
}
.moon{
  width:105px;height:105px;border-radius:50%;margin:0 auto 38px;
  background:radial-gradient(circle at 35% 35%,#fff,#d5e5d9 48%,#718b7c 78%,#253b30);
  box-shadow:0 0 35px rgba(185,230,205,.45),0 0 100px rgba(20,130,85,.3);
}
button{
  background:transparent;border:1px solid rgba(191,224,205,.65);
  color:#f4f5f0;padding:14px 26px;margin:14px 7px 0;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;
  cursor:pointer;transition:.3s;
}
button:hover{background:rgba(8,118,83,.4);border-color:#c8e6d5}
#music{
  position:fixed;top:18px;right:16px;z-index:5;
  padding:10px 13px;font-size:9px;background:rgba(0,0,0,.5);
}
#progress{
  position:fixed;bottom:0;left:0;height:2px;background:#16865e;
  width:0;transition:width .5s;z-index:5;
}
.hidden{display:none}
.fade{animation:appear 1.2s ease both}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  /* CINEMATIC MOTION */
.scene-image {
  animation: cinematicZoom 18s ease-in-out infinite alternate;
  transform-origin: center;
}

@keyframes cinematicZoom {
  from { transform: scale(1); }
  to { transform: scale(1.12); }
}

/* COSMIC GATEWAY */
body.cosmic #experience::before {
  background:
    radial-gradient(ellipse at 50% 48%, rgba(116,55,180,.38), transparent 35%),
    radial-gradient(ellipse at 50% 30%, rgba(8,118,83,.4), transparent 60%),
    radial-gradient(circle at 20% 20%, #263b69, transparent 30%),
    linear-gradient(160deg,#080817,#020403 80%);
  animation: cosmicPulse 7s ease-in-out infinite alternate;
}

@keyframes cosmicPulse {
  from { filter: brightness(.8); }
  to { filter: brightness(1.3); }
}
 /* COSMIC STARS */
body.cosmic #experience {
  background-image:
    radial-gradient(2px 2px at 15% 25%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 75% 20%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 45% 70%, #b9d8ff 50%, transparent 100%),
    radial-gradient(2px 2px at 85% 80%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 30% 90%, #c6a5ff 50%, transparent 100%),
    radial-gradient(2px 2px at 60% 45%, white 50%, transparent 100%);
  background-size: 100% 100%;
  animation: starTwinkle 4s ease-in-out infinite alternate;
}

@keyframes starTwinkle {
  from { opacity: .3; }
  to { opacity: 1; }
}
@media(max-width:480px){
  .eyebrow{letter-spacing:3px}
  button{padding:13px 18px}
}
</style>
</head>
<body>

<button id="music" onclick="toggleMusic()">♫ SOUND OFF</button>
<audio id="ambience" loop preload="none">
  <source src="audio/ambient.mp3" type="audio/mpeg">
</audio>

<main id="experience">
  <img class="scene-image" id="sceneImage" alt="">
  <div class="content fade" id="content"></div>
</main>
<div id="progress"></div>

<script>
const chapters = [
{
  eyebrow:"A STORY BEGINS",
  title:"BIRTHDAY WRITTEN<br>IN THE MOONLIGHT",
  text:"Some nights are meant to be remembered.<br>And some stories are written in the moonlight.",
  button:"ENTER THE NIGHT",
  image:"images/intro.jpg"
},
{
  eyebrow:"CHAPTER I · THE BEGINNING OF THE END",
  title:"DAWN OF THE DEAD",
  text:"The world has fallen. Survival is no longer optional.<br>But even in a world gone dark, a new chapter begins.",
  button:"START SURVIVAL",
  image:"images/chapter-01.jpg"
},
{
  eyebrow:"CHAPTER II · BEYOND THE UNKNOWN",
  title:"THE FORGOTTEN WOODS",
  text:"Not every path leads somewhere familiar.<br>Sometimes, the most beautiful things are found in the unknown.",
  button:"FOLLOW THE LIGHT",
  image:"images/chapter-02.jpg"
},
{
  eyebrow:"CHAPTER III · THE LONG ROAD",
  title:"THE WALKING DEAD",
  text:"Through every storm, every ending, every new beginning...<br>Keep walking. Your story isn't over.",
  button:"KEEP WALKING",
  image:"images/chapter-03.jpg"
},
{
  eyebrow:"CHAPTER IV · ANOTHER REALITY",
  title:"THE OTHER WORLD",
  text:"What if the universe is stranger and more beautiful than we imagine?<br>Somewhere between reality and dreams, another world awaits.",
  button:"CROSS OVER",
  image:"images/chapter-04.jpg"
},
{
  eyebrow:"THE FINAL CHAPTER",
  title:"THE MOON REMEMBERS",
  text:"Of all the worlds, all the paths, and all the endless nights...<br>the moon has witnessed a story that deserves a beautiful ending.",
  button:"REVEAL THE SECRET",
  image:"images/final.jpg"
},
{
  eyebrow:"NOVEMBER 12 · YOUR DAY",
  title:"HAPPY 29TH BIRTHDAY",
  text:"Another chapter begins, and I hope life surprises you with beautiful moments, unexpected blessings, and reasons to smile.<br><br>Distance may separate two places, but the moon still watches over both.<br><br>And if the moon could tell stories, it would know how much love it has witnessed.<br><br>With love, beneath the same moon.",
  button:"READ AGAIN",
  image:"images/final.jpg"
}
];

let current = 0;
let musicOn = false;
const content = document.getElementById("content");
const sceneImage = document.getElementById("sceneImage");
const progress = document.getElementById("progress");
const audio = document.getElementById("ambience");

function showChapter(index){
  current = index;
  document.body.classList.toggle("cosmic", index === 4);
  const c = chapters[current];
  content.classList.remove("fade");
  void content.offsetWidth;
  content.classList.add("fade");

  content.innerHTML = `
    ${current === 0 ? '<div class="moon"></div>' : ''}
    <div class="eyebrow">${c.eyebrow}</div>
    <h1>${c.title}</h1>
    <p>${c.text}</p>
    <button onclick="${current === chapters.length-1 ? 'showChapter(0)' : 'nextChapter()'}">${c.button}</button>
  `;

  sceneImage.style.display = "none";
  sceneImage.src = c.image;
  sceneImage.onload = () => { sceneImage.style.display = "block"; };
  progress.style.width = (current/(chapters.length-1)*100) + "%";
  window.scrollTo(0,0);
}

function nextChapter(){
  if(current < chapters.length-1) showChapter(current+1);
}

async function toggleMusic(){
  const button = document.getElementById("music");
  if(!musicOn){
    try{
      await audio.play();
      musicOn = true;
      button.textContent = "♫ SOUND ON";
    }catch(e){
      button.textContent = "♫ ADD MUSIC FILE";
    }
  }else{
    audio.pause();
    musicOn = false;
    button.textContent = "♫ SOUND OFF";
  }
}

showChapter(0);
</script>
</body>
</html>
