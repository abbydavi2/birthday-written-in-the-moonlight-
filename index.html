<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030706">
<title>Birthday Written in the Moonlight</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Cinzel:wght@400;500;600&display=swap');
:root {
  --silver: #d7ded9;
  --black: #030706;
  --emerald: #087653;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--black);
  color: #f5f4ef;
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  overflow: hidden;
}
#experience {
  min-height: 100vh;
  min-height: 100svh;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: center;
  isolation: isolate;
  overflow: hidden;
  padding: 0 22px;
}
#experience::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(8,118,83,.25), transparent 50%),
    linear-gradient(160deg,#07120e,#020403 75%);
}
#experience::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.05) 35%,
      rgba(0,0,0,.12) 55%,
      rgba(0,0,0,.82) 100%
    );
  pointer-events: none;
}
.scene-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  z-index: -2;
  opacity: .95;
  animation: cinematicZoom 24s ease-in-out infinite alternate;
  background: #030706;
}
@keyframes cinematicZoom {
  from { transform: scale(1); }
  to { transform: scale(1.09); }
}
.content {
  width: min(720px,100%);
  min-height: 100vh;
  min-height: 100svh;
  margin: auto;
  padding: max(65px, 11vh) 0 max(75px, 10vh);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  position: relative;
  text-align: center;
  pointer-events: none;
  z-index: 3;
}
  .content button {
  pointer-events: auto;
}  
.story-top {
  width: 100%;
}
.story-bottom {
  width: 100%;
  padding: 20px 10px;
  background: linear-gradient(
    180deg,
    transparent,
    rgba(0,0,0,.22) 20%,
    rgba(0,0,0,.48)
  );
}
.eyebrow {
  font-family: 'Cinzel',serif;
  letter-spacing: 4px;
  font-size: 10px;
  color: #c5d4cc;
  text-transform: uppercase;
  margin-bottom: 18px;
}
h1 {
  font-family: 'Cinzel',serif;
  font-weight: 400;
  line-height: 1.35;
  font-size: clamp(27px,7vw,52px);
  letter-spacing: 2px;
  text-shadow: 0 2px 25px #000;
  margin: 0 auto;
}
p {
  font-size: clamp(18px,4vw,24px);
  line-height: 1.5;
  color: #f0f0eb;
  max-width: 570px;
  margin: 0 auto 20px;
  text-shadow: 0 2px 15px #000;
}
button {
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(220,230,222,.75);
  color: #fff;
  padding: 14px 24px;
  margin: 8px 5px;
  font-family: 'Cinzel',serif;
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: .35s;
}
button:hover {
  background: rgba(255,255,255,.14);
  border-color: white;
}
#music {
  position: fixed;
  top: 16px;
  right: 14px;
  z-index: 10;
  padding: 10px 13px;
  font-size: 9px;
  background: rgba(0,0,0,.55);
}
#progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 2px;
  background: #d7ded9;
  width: 0;
  transition: width .6s;
  z-index: 10;
}
.navigation {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
}
.navigation button {
  min-width: 115px;
}
.fade {
  animation: appear 1.1s ease both;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
/* THE GATE */
body.gate #experience::after {
  background:
    linear-gradient(180deg,rgba(0,0,0,.55),transparent 38%,rgba(0,0,0,.72)),
    radial-gradient(ellipse at center,rgba(103,65,170,.12),transparent 65%);
}
/* THE OTHER WORLD */
body.otherworld #experience::after {
  background:
    linear-gradient(180deg,rgba(0,0,0,.38),transparent 38%,rgba(0,0,0,.72)),
    radial-gradient(ellipse at center,rgba(170,65,210,.10),transparent 70%);
}
/* THE MOON */
body.moon #experience::before {
  background: linear-gradient(160deg,#101b2b,#080d19 70%,#02040a);
}
body.moon #experience::after {
  background:
    linear-gradient(180deg,rgba(5,10,20,.42),transparent 40%,rgba(5,10,20,.75));
}
/* FINAL MESSAGE */
body.ending #experience::after {
  background: linear-gradient(
    180deg,
    rgba(5,10,20,.65),
    rgba(5,10,20,.25) 40%,
    rgba(5,10,20,.85)
  );
}
@media(max-width:480px) {
  .content {
    padding-top: 85px;
    padding-bottom: 65px;
  }
  .eyebrow { letter-spacing: 2.5px; }
  h1 { letter-spacing: 1px; }
  p { font-size: 19px; }
  button { padding: 13px 17px; }
}
  /* CINEMATIC EFFECTS */
#effects {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

#experience {
  touch-action: manipulation;
}

.scene-image {
  transition: opacity 1s ease, filter 1s ease;
  will-change: transform, opacity;
}

#sceneImage.effect-active {
  filter: brightness(1.12) contrast(1.08);
}

.effect-particle {
  position: absolute;
  display: block;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  animation: particleFloat var(--duration, 5s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

@keyframes particleFloat {
  0% {
    opacity: 0;
    transform: translate3d(0, 25px, 0) scale(.5);
  }
  25% { opacity: var(--opacity, .7); }
  75% { opacity: var(--opacity, .7); }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift, 20px), -100px, 0) scale(1.3);
  }
}

#effects::before {
  content: "";
  position: absolute;
  inset: -20%;
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: none;
}

body.intro #effects::before {
  opacity: .65;
  background: radial-gradient(
    circle at 50% 30%,
    rgba(210,225,220,.20),
    transparent 38%
  );
  animation: moonPulse 5s ease-in-out infinite alternate;
}

@keyframes moonPulse {
  from { transform: scale(.95); opacity: .35; }
  to { transform: scale(1.08); opacity: .8; }
}

body.zombie #effects::before {
  opacity: .8;
  background: radial-gradient(
    ellipse at 50% 50%,
    transparent 15%,
    rgba(0,0,0,.35) 75%
  );
}

body.woods .effect-particle {
  background: #b8ffd7;
  box-shadow: 0 0 12px 4px rgba(115,255,190,.65);
}

body.gate .effect-particle {
  background: #d8c4ff;
  box-shadow: 0 0 14px 4px rgba(175,120,255,.8);
}

body.otherworld .effect-particle {
  background: #e9aaff;
  box-shadow: 0 0 15px 5px rgba(190,90,255,.7);
}

body.moon #effects::before {
  opacity: .65;
  background: linear-gradient(
    0deg,
    transparent 35%,
    rgba(170,200,255,.16) 60%,
    transparent 80%
  );
  animation: riverShimmer 4s ease-in-out infinite alternate;
}

@keyframes riverShimmer {
  from { transform: translateX(-3%) scaleY(.95); }
  to { transform: translateX(3%) scaleY(1.05); }
}

body.ending #effects::before {
  opacity: .8;
  background: radial-gradient(
    circle at 50% 65%,
    rgba(255,55,35,.25),
    transparent 48%
  );
  animation: flarePulse 2s ease-in-out infinite alternate;
}

@keyframes flarePulse {
  from { opacity: .25; }
  to { opacity: .9; }
}

.scene-hint {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.72);
  margin: 10px auto;
  animation: hintPulse 2.5s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { opacity: .45; }
  50% { opacity: 1; }
}

#effects.active {
  animation: effectFlash .7s ease;
}

@keyframes effectFlash {
  0% { opacity: .3; }
  45% { opacity: 1; }
  100% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .effect-particle,
  #effects::before,
  .scene-hint {
    animation: none !important;
  }
}
  /* INTERACTIVE SCENES */
.flashlight-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: auto;
  opacity: 0;
  background: radial-gradient(
    circle 125px at var(--light-x, 50%) var(--light-y, 50%),
    rgba(255,255,220,.28),
    rgba(255,255,220,.08) 45%,
    rgba(0,0,0,.82) 100%
  );
  transition: opacity .5s ease;
  cursor: crosshair;
}

.flashlight-overlay.active {
  opacity: 1;
}

.firefly {
  position: absolute;
  z-index: 3;  
  pointer-events: auto;
  width: 18px;
  height: 18px;
  min-width: 0;
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 50%;
  background: #caffd9;
  box-shadow:
    0 0 8px 4px rgba(150,255,190,.7),
    0 0 25px 10px rgba(100,255,160,.3);
  animation: fireflyGlow 2s ease-in-out infinite alternate;
  cursor: pointer;
}

.firefly.found {
  opacity: 0;
  transform: scale(2);
  pointer-events: none;
  transition: .5s ease;
}

@keyframes fireflyGlow {
  from { opacity: .45; transform: scale(.8); }
  to { opacity: 1; transform: scale(1.25); }
}

body.woods #effects.complete {
  filter: brightness(1.35);
}
  /* WALKING DEAD - FOOTPRINTS */
.footprint {
  position: absolute;
  z-index: 2;
  width: 20px;
  height: 34px;
  opacity: 0;
  filter: drop-shadow(0 0 7px rgba(220,230,225,.5));
  animation: footprintReveal .9s ease forwards;
  pointer-events: none;
}

.footprint::before {
  content: "";
  position: absolute;
  left: 5px;
  bottom: 0;
  width: 11px;
  height: 23px;
  border-radius: 55% 45% 48% 52% / 35% 35% 65% 65%;
  background: rgba(220,230,225,.58);
}

.footprint::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 1px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(220,230,225,.58);
  box-shadow:
    -5px 5px 0 -1px rgba(220,230,225,.5),
    5px 5px 0 -1px rgba(220,230,225,.5);
}

.footprint.left { --turn: -18deg; }
.footprint.right { --turn: 18deg; }

@keyframes footprintReveal {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.65) rotate(var(--turn));
  }
  to {
    opacity: .65;
    transform: translateY(0) scale(1) rotate(var(--turn));
  }
}
  /* THE GATE - STAR ACTIVATION */
.gate-star {
  position: absolute;
  z-index: 2;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #eadbff;
  box-shadow:
    0 0 8px 3px rgba(190,140,255,.8),
    0 0 20px 7px rgba(145,80,255,.4);
  opacity: 0;
  transform: scale(.2);
  animation: gateStarAppear 1.5s ease forwards;
  pointer-events: none;
}

@keyframes gateStarAppear {
  0% {
    opacity: 0;
    transform: scale(.2);
  }
  45% {
    opacity: 1;
    transform: scale(1.8);
  }
  100% {
    opacity: .85;
    transform: scale(1);
  }
}
  /* WALKING DEAD - INTERACTIVE MUZZLE FLASH */
.gun-flash {
  position: absolute;
  z-index: 4;
  left: 61.5%;
  top: 43%;
  width: 48px;
  height: 48px;
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  pointer-events: auto;
  transform: translate(-50%, -50%);
  cursor: pointer;
}

.gun-flash::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #ffffff 0%,
    #fff7c2 20%,
    rgba(255, 190, 70, .9) 42%,
    rgba(255, 100, 20, 0) 75%
  );
  box-shadow:
    0 0 10px 5px rgba(255, 230, 160, .6),
    0 0 24px 12px rgba(255, 140, 40, .4);
  opacity: .25;
}

.gun-flash.active::before {
  animation: muzzleBurst .35s ease-out;
}

.gun-flash::after {
  content: "";
  position: absolute;
  inset: -8px;
  background: #fff8d6;
  clip-path: polygon(
    50% 0%, 60% 38%, 100% 50%,
    60% 62%, 50% 100%, 40% 62%,
    0% 50%, 40% 38%
  );
  opacity: 0;
}

.gun-flash.active::after {
  animation: muzzleRays .25s ease-out;
}

@keyframes muzzleBurst {
  0% {
    opacity: 1;
    transform: scale(.5);
  }
  100% {
    opacity: 0;
    transform: scale(4);
  }
}

@keyframes muzzleRays {
  0% {
    opacity: 1;
    transform: scale(.3);
  }
  100% {
    opacity: 0;
    transform: scale(2.5);
  }
}
</style>
</head>
<body>
<button id="music" onclick="toggleMusic()">♫ SOUND OFF</button>
<audio id="ambience" loop preload="none">
  <source src="audio/ambient.mp3" type="audio/mpeg">
</audio>
<main id="experience">
  <div id="effects"></div>
  <img class="scene-image" id="sceneImage" alt="">
  <div class="content fade" id="content">
    <div class="story-top" id="storyTop"></div>
    <div class="story-bottom" id="storyBottom"></div>
  </div>
</main>
<div id="progress"></div>
<script>
const chapters = [
  {
    theme: "intro",
    eyebrow: "A STORY BEGINS",
    title: "BIRTHDAY WRITTEN<br>IN THE MOONLIGHT",
    text: "Some nights are meant to be remembered.<br>And some stories are written in the moonlight.",
    button: "ENTER THE NIGHT",
    image: "photos/00.jpeg"
  },
  {
    theme: "zombie",
    eyebrow: "CHAPTER I · THE BEGINNING OF THE END",
    title: "DAWN OF THE DEAD",
    text: "The world has fallen. Survival is no longer optional.<br>But even in a world gone dark, a new chapter begins.",
    button: "START SURVIVAL",
    image: "photos/01.jpeg"
  },
  {
    theme: "woods",
    eyebrow: "CHAPTER II · BEYOND THE UNKNOWN",
    title: "THE FORGOTTEN WOODS",
    text: "Not every path leads somewhere familiar.<br>Sometimes, the most beautiful things are found in the unknown.",
    button: "FOLLOW THE LIGHT",
    image: "photos/02.jpeg"
  },
  {
    theme: "walkingdead",
    eyebrow: "CHAPTER III · THE LONG ROAD",
    title: "THE WALKING DEAD",
    text: "Through every storm, every ending, every new beginning...<br>Keep walking. Your story isn't over.",
    button: "KEEP WALKING",
    image: "photos/03.jpeg"
  },
  {
    theme: "gate",
    eyebrow: "CHAPTER IV · THE PASSAGE",
    title: "THE GATE",
    text: "Some doors are not made of wood or stone.<br>Some are written in the stars.",
    button: "ENTER THE GATE",
    image: "photos/04.jpeg"
  },
  {
    theme: "otherworld",
    eyebrow: "CHAPTER V · BEYOND REALITY",
    title: "THE OTHER WORLD",
    text: "Here, the impossible becomes beautiful.<br>A universe of wonder, freedom, love and peace.",
    button: "EXPLORE THIS WORLD",
    image: "photos/05.jpeg"
  },
  {
    theme: "moon",
    eyebrow: "CHAPTER VI · THE WAY HOME",
    title: "THE MOON REMEMBERS",
    text: "The storm has passed.<br>Across the river, the people he loves are waiting.<br>He is closer than ever to home.",
    button: "LOOK CLOSER",
    image: "photos/06.jpeg"
  },
  {
    theme: "ending",
    eyebrow: "NOVEMBER 12 · YOUR DAY",
    title: "HAPPY 29TH BIRTHDAY",
    text: "Another chapter begins, and I hope life surprises you with beautiful moments, unexpected blessings, and reasons to smile.<br><br>Distance may separate two places, but the moon still watches over both.<br><br>And if the moon could tell stories, it would know how much love it has witnessed.<br><br>With love, beneath the same moon.",
    button: "EXPERIENCE AGAIN",
    image: "photos/07.jpeg"
  }
];
let current = 0;
let musicOn = false;
const content = document.getElementById("content");
const storyTop = document.getElementById("storyTop");
const storyBottom = document.getElementById("storyBottom");
const sceneImage = document.getElementById("sceneImage");
const progress = document.getElementById("progress");
const audio = document.getElementById("ambience");
const musicButton = document.getElementById("music");
  const effects = document.getElementById("effects");

function createParticles(theme) {
  effects.innerHTML = "";
  effects.classList.remove("complete");
  sceneImage.classList.remove("effect-active");

  const settings = {
    intro: { count: 18, color: "#dce8e5" },
    zombie: { count: 12, color: "#a8b6a9" },
    woods: { count: 28, color: "#aaffcc" },
    walkingdead: { count: 18, color: "#c7c7b5" },
    gate: { count: 35, color: "#d8c4ff" },
    otherworld: { count: 32, color: "#e9aaff" },
    moon: { count: 24, color: "#c7ddff" },
    ending: { count: 38, color: "#ff795f" }
  };

  const config = settings[theme] || settings.intro;

  for (let i = 0; i < config.count; i++) {
    const particle = document.createElement("span");
    particle.className = "effect-particle";

    particle.style.left = Math.random() * 100 + "%";
    particle.style.top = (35 + Math.random() * 65) + "%";
    particle.style.background = config.color;
    particle.style.setProperty("--duration", (4 + Math.random() * 6) + "s");
    particle.style.setProperty("--delay", (-Math.random() * 8) + "s");
    particle.style.setProperty("--drift", (Math.random() * 50 - 25) + "px");
    particle.style.setProperty("--opacity", (0.3 + Math.random() * 0.6));

    const size = 2 + Math.random() * 4;
    particle.style.width = size + "px";
    particle.style.height = size + "px";

    effects.appendChild(particle);
  }
}

function createSceneInteraction(theme) {
  if (theme === "zombie") {
    const flashlight = document.createElement("div");
    flashlight.className = "flashlight-overlay";
    flashlight.setAttribute("aria-label", "Tap to use flashlight");

    flashlight.addEventListener("pointerdown", (event) => {
      const x = event.clientX / window.innerWidth * 100;
      const y = event.clientY / window.innerHeight * 100;

      flashlight.style.setProperty("--light-x", x + "%");
      flashlight.style.setProperty("--light-y", y + "%");
      flashlight.classList.add("active");
    });

    effects.appendChild(flashlight);
  }

  if (theme === "woods") {
    const positions = [
      { left: "25%", top: "42%" },
      { left: "70%", top: "52%" },
      { left: "48%", top: "72%" }
    ];

    let found = 0;

    positions.forEach((position) => {
      const firefly = document.createElement("button");
      firefly.className = "firefly";
      firefly.setAttribute("aria-label", "Catch a firefly");
      firefly.style.left = position.left;
      firefly.style.top = position.top;

      firefly.addEventListener("click", () => {
        if (firefly.classList.contains("found")) return;

        firefly.classList.add("found");
        found++;

        if (found === 3) {
          effects.classList.add("complete");
          sceneImage.classList.add("effect-active");
        }
      });

      effects.appendChild(firefly);
    });
  }

  if (theme === "walkingdead") {
    const footprints = [
      { left: "44%", top: "78%", side: "left", delay: "0s" },
      { left: "55%", top: "68%", side: "right", delay: "1s" },
      { left: "43%", top: "58%", side: "left", delay: "2s" },
      { left: "56%", top: "48%", side: "right", delay: "3s" },
      { left: "44%", top: "38%", side: "left", delay: "4s" },
      { left: "55%", top: "28%", side: "right", delay: "5s" }
    ];

    footprints.forEach((step) => {
      const footprint = document.createElement("span");
      footprint.className = "footprint " + step.side;
      footprint.style.left = step.left;
      footprint.style.top = step.top;
      footprint.style.animationDelay = step.delay;
      effects.appendChild(footprint);
    });
  }
  if (theme === "walkingdead") {
    const gunFlash = document.createElement("button");
    gunFlash.className = "gun-flash";
    gunFlash.setAttribute("aria-label", "Activate the light");

    gunFlash.addEventListener("click", () => {
      gunFlash.classList.remove("active");
      void gunFlash.offsetWidth;
      gunFlash.classList.add("active");
    });

    effects.appendChild(gunFlash);
  }
  if (theme === "gate") {
    const stars = [
      { left: "35%", top: "35%", delay: "0s" },
      { left: "48%", top: "25%", delay: "1s" },
      { left: "62%", top: "34%", delay: "2s" },
      { left: "70%", top: "49%", delay: "3s" },
      { left: "55%", top: "60%", delay: "4s" },
      { left: "39%", top: "55%", delay: "5s" },
      { left: "48%", top: "43%", delay: "6s" }
    ];

    stars.forEach((point) => {
      const star = document.createElement("span");
      star.className = "gate-star";
      star.style.left = point.left;
      star.style.top = point.top;
      star.style.animationDelay = point.delay;
      effects.appendChild(star);
    });
  }
}
function showChapter(index) {
  current = index;
  const chapter = chapters[current];
  document.body.className = chapter.theme;
createParticles(chapter.theme);
createSceneInteraction(chapter.theme);
  content.classList.remove("fade");
  void content.offsetWidth;
  content.classList.add("fade");
  storyTop.innerHTML = `
    <div class="eyebrow">${chapter.eyebrow}</div>
    <h1>${chapter.title}</h1>
  `;
  storyBottom.innerHTML = `
    <p>${chapter.text}</p>
    <div class="navigation">
      ${current > 0
        ? '<button onclick="previousChapter()">PREVIOUS</button>'
        : ''}
      <button onclick="nextChapter()">
        ${current === chapters.length - 1
          ? 'EXPERIENCE AGAIN'
          : chapter.button}
      </button>
    </div>
  `;
  sceneImage.style.display = "none";
  sceneImage.onload = () => {
    sceneImage.style.display = "block";
  };
  sceneImage.onerror = () => {
    sceneImage.style.display = "none";
    console.error("Image not found:", chapter.image);
  };
  sceneImage.src = chapter.image;
  progress.style.width =
    (current / (chapters.length - 1) * 100) + "%";
}
function nextChapter() {
  if (current < chapters.length - 1) {
    showChapter(current + 1);
  } else {
    showChapter(0);
  }
}
function previousChapter() {
  if (current > 0) {
    showChapter(current - 1);
  }
}
async function toggleMusic() {
  if (!musicOn) {
    try {
      await audio.play();
      musicOn = true;
      musicButton.textContent = "♫ SOUND ON";
    } catch (error) {
      musicButton.textContent = "♫ ADD MUSIC FILE";
    }
  } else {
    audio.pause();
    musicOn = false;
    musicButton.textContent = "♫ SOUND OFF";
  }
}
showChapter(0);
</script>
</body>
</html>
